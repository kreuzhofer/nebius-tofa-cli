name: Prototype checks
on:
  push:
    branches: [main, prototype/direct-launcher]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o tofa ./cmd/tofa
        if: runner.os != 'Windows'
      - run: python3 scripts/install_test.py
        if: runner.os != 'Windows'
      - name: Build versioned candidate bundle
        if: runner.os != 'Windows'
        run: sh scripts/build.sh v0.0.0-ci
      - name: Native candidate installation lifecycle
        if: runner.os != 'Windows'
        run: python3 scripts/lifecycle_test.py dist v0.0.0-ci -v
      - run: python3 scripts/terminal_test.py ./tofa
        if: runner.os != 'Windows'
      - name: Offline live-harness qualification checks
        if: runner.os != 'Windows'
        run: python3 scripts/live_compat_test.py -f
      - name: Parse PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1','scripts/uninstall.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Offline Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_test.ps1
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: sh scripts/build.sh v0.0.0-prototype
      - name: Verify complete versioned distributions
        run: python3 scripts/build_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-binaries
          path: dist/
